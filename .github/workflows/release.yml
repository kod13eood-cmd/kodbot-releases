name: Release packages

# Build installable KodBot packages and attach them to a GitHub release.
# Trigger by pushing a v* tag to this repository. The source commit/ref is
# pinned below so the tag, the packages, and the source tree are one unit.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  # Unique per run: re-tagging a release must not deadlock behind a stale
  # queue entry from the previous tag object.
  group: release-${{ github.run_id }}
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: kod13eood-cmd/KodBot
  SOURCE_REF: feat/vnc-record-voice

jobs:
  prepare:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          NOTES="$(cat <<EOF
          KodBot ${VERSION}

          Bulgarian transcription and Android voice notes. Local speech-to-text now uses the small Whisper model with beam search 5, and App Settings -> Voice has an Auto / Bulgarian / English recognition language. Bulgarian text should be more accurate; CPU transcription is slower.

          The Android native composer has a new audio-lines button: record a voice note, play it back, see the transcript when ready, and send it as an attachment. Android is now 0.1.20 (versionCode 21) and updates in place with the stable key.

          Desktop ${VERSION} includes the same language setting and the voice-note composer from 0.1.43. **Linux:** AppImage and .deb (x64). **Windows:** unsigned NSIS installer (SmartScreen: More info -> Run anyway). macOS: separate signed/notarized flow.
          EOF
          )"
          code=$(curl -sS -o /tmp/existing.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API}/releases/tags/${TAG}")
          if [ "$code" = "200" ]; then
            echo "release ${TAG} already exists; refreshing its notes"
            jq -n --arg name "KodBot ${VERSION}" --arg body "$NOTES" \
              '{name:$name,body:$body}' > /tmp/release-update.json
            code=$(curl -sS -o /tmp/update.json -w '%{http_code}' \
              -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/release-update.json \
              "${API}/releases/tags/${TAG}")
            if [ "$code" != "200" ]; then
              echo "::error::release update failed with HTTP ${code}: $(head -c 500 /tmp/update.json)"
              exit 1
            fi
            exit 0
          fi
          jq -n --arg tag "$TAG" --arg name "KodBot ${VERSION}" --arg body "$NOTES" \
            '{tag_name:$tag,name:$name,draft:true,body:$body}' > /tmp/release.json
          code=$(curl -sS -o /tmp/create.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/release.json \
            "${API}/releases")
          if [ "$code" != "201" ]; then
            echo "::error::release create failed with HTTP ${code}: $(head -c 500 /tmp/create.json)"
            exit 1
          fi
          echo "created draft release ${TAG}"

  linux:
    name: Linux AppImage + deb
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kod13eood-cmd/KodBot
          ref: feat/vnc-record-voice
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Build packages
        working-directory: source
        run: |
          pnpm install --frozen-lockfile
          pnpm package:linux
      - name: Stable filenames and version check
        working-directory: source
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "v${VERSION}" = "${GITHUB_REF_NAME}" || {
            echo "::error::package.json is ${VERSION}, tag is ${GITHUB_REF_NAME}"
            exit 1
          }
          cp "release/KodBot-${VERSION}-x86_64.AppImage" release/KodBot.AppImage
          cp "release/KodBot-${VERSION}-amd64.deb" release/KodBot.deb
          ls -lh release/*.AppImage release/*.deb release/latest-linux.yml
      - name: Upload Linux assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: kod13eood-cmd/kodbot-releases
        working-directory: source
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            release/KodBot-*-x86_64.AppImage \
            release/KodBot-*-amd64.deb \
            release/KodBot.AppImage \
            release/KodBot.deb \
            release/latest-linux.yml \
            --clobber

  windows:
    name: Windows installer
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kod13eood-cmd/KodBot
          ref: feat/vnc-record-voice
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Build installer
        shell: bash
        working-directory: source
        run: |
          pnpm install --frozen-lockfile
          pnpm package:win
      - name: Verify packaged tree
        shell: bash
        working-directory: source
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "v${VERSION}" = "${GITHUB_REF_NAME}" || {
            echo "::error::package.json is ${VERSION}, tag is ${GITHUB_REF_NAME}"
            exit 1
          }
          res=release/win-unpacked/resources
          test -f "$res/server/index.js"
          test -f "$res/ui/index.html"
          test -f "$res/app-update.yml"
          if grep -q publisherName "$res/app-update.yml"; then
            echo "::error::app-update.yml carries publisherName on an unsigned build"
            exit 1
          fi
          grep -q "provider: github" "$res/app-update.yml"
          grep -q "kodbot-releases" "$res/app-update.yml"
          cp "release/KodBot-${VERSION}-setup.exe" release/KodBot-setup.exe
          ls -lh release/*.exe release/*.yml release/*.blockmap
      # Existence is not execution. Start the packaged server the same way
      # the installer will, with no node_modules in the tree, and require
      # /api/health before uploading.
      - name: Start packaged server
        shell: bash
        working-directory: source
        run: |
          res=release/win-unpacked/resources
          HOME="$RUNNER_TEMP/kodbot-smoke" USERPROFILE="$RUNNER_TEMP/kodbot-smoke" \
            OC_PORT=21987 node "$res/server/index.js" > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:21987/api/health >/dev/null 2>&1; then
              echo "packaged server answered /api/health"
              kill $pid 2>/dev/null || true
              exit 0
            fi
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          echo "::error::the packaged server never served /api/health"
          cat "$RUNNER_TEMP/server.log" || true
          kill $pid 2>/dev/null || true
          exit 1
      - name: Upload Windows assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: kod13eood-cmd/kodbot-releases
        working-directory: source
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            release/KodBot-*-setup.exe \
            release/KodBot-setup.exe \
            release/KodBot-*-setup.exe.blockmap \
            release/latest.yml \
            --clobber

  android:
    name: Android APK
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kod13eood-cmd/KodBot
          ref: feat/vnc-record-voice
          path: source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Require and decode the stable Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured. Refusing to publish an APK signed with an ephemeral debug key."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kodbot-android.keystore"
      - name: Build APK
        working-directory: source/android
        env:
          KODBOT_ANDROID_KEYSTORE: ${{ runner.temp }}/kodbot-android.keystore
          KODBOT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KODBOT_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KODBOT_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - name: Verify the APK uses the installed signing key
        shell: bash
        working-directory: source/android
        env:
          EXPECTED_SHA256: 0b20035e3dc7726f6a5181824fcb85461c9460588369a610dad53ddcd65c2369
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          apksigner="$(find "$sdk" -path '*/build-tools/*/apksigner' -type f | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/apk-certs.txt"
          grep -qi "SHA-256 digest: $EXPECTED_SHA256" "$RUNNER_TEMP/apk-certs.txt"
      - name: Stable filenames
        working-directory: source
        run: |
          VERSION="$(awk -F'"' '/versionName = / { print $2; exit }' android/app/build.gradle.kts)"
          test -n "$VERSION"
          cp android/app/build/outputs/apk/debug/app-debug.apk "KodBot-android-${VERSION}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk KodBot-android.apk
          ls -lh KodBot-android*.apk
      - name: Upload Android assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: kod13eood-cmd/kodbot-releases
        working-directory: source
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            KodBot-android-*.apk \
            KodBot-android.apk \
            --clobber

  publish:
    name: Publish latest release
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: kod13eood-cmd/kodbot-releases
        run: |
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest --title "KodBot ${GITHUB_REF_NAME#v}"
